 <!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ម៉ាស៊ីនគិតលេខអគ្គិសនី</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&display=swap" rel="stylesheet" />
    <style>
        * {
            font-family: 'Battambang', sans-serif;
        }
        .khmer-title {
            font-family: 'Moul', serif;
        }
        body {
            background: radial-gradient(ellipse at 20% 50%, #1a1a2e, #16213e, #0f0f1f);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        /* កាតធំ */
        .main-card {
            background: linear-gradient(165deg, #1e1e3f, #2a1a3a);
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,215,0,0.05);
            backdrop-filter: blur(12px);
        }
        /* ប្រអប់បញ្ចូល */
        .meter-input {
            background: #0d0d1f;
            border: 2px solid #3a2a4a;
            color: #fbbf24;
            transition: all 0.3s ease;
        }
        .meter-input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.15), inset 0 0 20px rgba(245, 158, 11, 0.05);
            outline: none;
        }
        /* កាតកម្រិតតម្លៃ */
        .tier-card {
            background: linear-gradient(145deg, #1a1a35, #252545);
            border: 2px solid #3a2a5a;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        .tier-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,215,0,0.03), transparent, rgba(255,215,0,0.03), transparent);
            animation: rotateGlow 8s linear infinite;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .tier-card.active::before {
            opacity: 1;
        }
        @keyframes rotateGlow {
            100% { transform: rotate(360deg); }
        }
        .tier-card.active {
            transform: scale(1.05) translateY(-6px);
            border-color: #f59e0b;
            box-shadow: 0 12px 35px -8px rgba(245, 158, 11, 0.4), inset 0 0 30px rgba(245, 158, 11, 0.05);
            background: linear-gradient(145deg, #2a2a4a, #1f1f3f);
        }
        .tier-card .tier-badge {
            background: linear-gradient(135deg, #3a2a5a, #2a1a4a);
            border: 1px solid rgba(255,215,0,0.1);
        }
        .tier-card.active .tier-badge {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f0f1f;
            border-color: #f59e0b;
        }
        /* ប៊ូតុង */
        .btn-reset {
            background: linear-gradient(145deg, #dc2626, #991b1b);
            box-shadow: 0 8px 25px -8px rgba(220, 38, 38, 0.3);
        }
        .btn-reset:hover {
            background: linear-gradient(145deg, #ef4444, #dc2626);
            transform: scale(1.05);
        }
        .btn-calc {
            background: linear-gradient(145deg, #8b5cf6, #6d28d9);
            box-shadow: 0 8px 25px -8px rgba(139, 92, 246, 0.4);
        }
        .btn-calc:hover {
            background: linear-gradient(145deg, #a78bfa, #7c3aed);
            transform: scale(1.05);
 }
        .btn-press:active {
            transform: scale(0.92) !important;
        }
        /* បន្ទះលទ្ធផល */
        .result-box {
            background: linear-gradient(145deg, #0d0d1f, #1a1a35);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        .result-box .value {
            background: linear-gradient(135deg, #fbbf24, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.15);
        }
        /* រង្វង់បង្ហាញ */
        .stat-circle {
            background: radial-gradient(circle at 30% 30%, #1a1a35, #0d0d1f);
            border: 2px solid #3a2a5a;
            transition: all 0.3s ease;
        }
        .stat-circle.highlight {
            border-color: #8b5cf6;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
        }
        /* របារវឌ្ឍនភាព */
        .progress-bar {
            height: 4px;
            background: #2a2a4a;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #f59e0b);
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 0%;
        }
    </style>
</head>
<body>

<div class="main-card w-full max-w-lg rounded-[2.5rem] p-7 space-y-7">

    <!-- Header -->
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-amber-400 to-purple-500 flex items-center justify-center shadow-lg shadow-purple-500/20">
                <span class="text-xl">⚡</span>
            </div>
            <h1 class="khmer-title text-lg bg-gradient-to-r from-amber-300 via-purple-300 to-pink-300 bg-clip-text text-transparent">
                គណនាអគ្គិសនី
            </h1>
        </div>
        <button onclick="resetAll()" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 transition-all border border-white/10 btn-press">
            <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 15H19c0 5.523-4.477 10-10 10S0 20.523 0 15 4.477 5 10 5c2.478 0 4.74.903 6.47 2.398L20 4v5h-5" />
            </svg>
        </button>
    </div>

    <!-- Inputs -->
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-bold text-purple-300/80 mb-1.5">📘 ម៉ែត្រចាស់</label>
            <input type="number" id="oldMeter" value="0" min="0"
                   onfocus="if(this.value=='0') this.value=''"
                   onblur="if(this.value=='') this.value='0'"
                   class="meter-input w-full text-xl font-bold rounded-2xl px-4 py-3.5 text-center" />
        </div>
        <div>
            <label class="block text-sm font-bold text-purple-300/80 mb-1.5">📗 ម៉ែត្រថ្មី</label>
            <input type="number" id="newMeter" value="0" min="0"
                   onfocus="if(this.value=='0') this.value=''"
                   onblur="if(this.value=='') this.value='0'"
                   class="meter-input w-full text-xl font-bold rounded-2xl px-4 py-3.5 text-center" />
        </div>
    </div>

    <!-- Tier Cards -->
    <div class="grid grid-cols-4 gap-2 text-xs">
        <div id="tier1" class="tier-card rounded-2xl p-2.5 text-center">
            <div class="tier-badge rounded-lg px-1.5 py-0.5 text-[10px] font-bold text-amber-300 inline-block mb-1">ទី១</div>
            <p class="font-bold text-white/90 text-[11px]">០–១០</p>
 <p class="text-amber-400 font-bold text-[13px]">៣៨០ ៛</p>
        </div>
        <div id="tier2" class="tier-card rounded-2xl p-2.5 text-center">
            <div class="tier-badge rounded-lg px-1.5 py-0.5 text-[10px] font-bold text-amber-300 inline-block mb-1">ទី២</div>
            <p class="font-bold text-white/90 text-[11px]">១១–៥០</p>
            <p class="text-amber-400 font-bold text-[13px]">៤៨០ ៛</p>
        </div>
        <div id="tier3" class="tier-card rounded-2xl p-2.5 text-center">
            <div class="tier-badge rounded-lg px-1.5 py-0.5 text-[10px] font-bold text-amber-300 inline-block mb-1">ទី៣</div>
            <p class="font-bold text-white/90 text-[11px]">៥១–២០០</p>
            <p class="text-amber-400 font-bold text-[13px]">៦១០ ៛</p>
        </div>
        <div id="tier4" class="tier-card rounded-2xl p-2.5 text-center">
            <div class="tier-badge rounded-lg px-1.5 py-0.5 text-[10px] font-bold text-amber-300 inline-block mb-1">ទី៤</div>
            <p class="font-bold text-white/90 text-[11px]">២០១+</p>
            <p class="text-amber-400 font-bold text-[13px]">៧៣០ ៛</p>
        </div>
    </div>

    <!-- Buttons -->
    <div class="flex items-center justify-center gap-6">
        <button onclick="resetAll()" class="btn-reset w-16 h-16 rounded-full flex flex-col items-center justify-center btn-press ring-4 ring-purple-900/30">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 15H19c0 5.523-4.477 10-10 10S0 20.523 0 15 4.477 5 10 5c2.478 0 4.74.903 6.47 2.398L20 4v5h-5" />
            </svg>
            <span class="text-[10px] font-bold text-white/80 mt-0.5">សម្អាត</span>
        </button>
        <button onclick="calculate()" class="btn-calc w-20 h-20 rounded-full flex flex-col items-center justify-center btn-press ring-4 ring-purple-900/30">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
            <span class="text-xs font-bold text-white/80 mt-0.5">គណនា</span>
        </button>
    </div>

    <!-- Statistics -->
    <div class="grid grid-cols-3 gap-3">
        <div class="stat-circle rounded-2xl p-3 text-center">
            <p class="text-[10px] text-purple-300/60 font-bold uppercase tracking-wider">ប្រើប្រាស់</p>
            <p id="unitsDisplay" class="text-xl font-black text-amber-400">—</p>
            <p class="text-[8px] text-purple-300/40">គីឡូវ៉ាត់</p>
        </div>
        <div class="stat-circle rounded-2xl p-3 text-center">
            <p class="text-[10px] text-purple-300/60 font-bold uppercase tracking-wider">តម្លៃ/គីឡូ</p>
            <p id="rateDisplay" class="text-xl font-black text-purple-400">—</p>
            <p class="text-[8px] text-purple-300/40">រៀល</p>
        </div>
        <div class="stat-circle rounded-2xl p-3 text-center">
            <p class="text-[10px] text-purple-300/60 font-bold uppercase tracking-wider">ជួរ</p>
            <p id="rangeDisplay" class="text-sm font-black text-white/80 truncate">—</p>
            <p class="text-[8px] text-purple-300/40">ចាស់→ថ្មី</p>
        </div>
    </div>

    <!-- Total + Progress -->
    <div class="result-box rounded-2xl p-5 space-y-3">
        <div class="text-center">
            <p class="text-4xl font-black">
                <span id="totalDisplay" class="value">០</span>
                <span class="text-xl font-bold text-white/40"> ៛</span>
 </p>
            <p class="text-[11px] font-bold text-purple-300/40 tracking-[0.15em] uppercase mt-1">តម្លៃសរុបត្រូវបង់</p>
        </div>
        <div class="progress-bar">
            <div id="progressFill" class="fill"></div>
        </div>
        <p class="text-[9px] text-center text-purple-300/30">បង្ហាញ % នៃការប្រើប្រាស់ធៀបនឹងកម្រិត ២០០ គីឡូ</p>
    </div>

</div>

<script>
    const tiers = [
        { id: 'tier1', max: 10, rate: 380 },
        { id: 'tier2', max: 50, rate: 480 },
        { id: 'tier3', max: 200, rate: 610 },
        { id: 'tier4', max: Infinity, rate: 730 }
    ];

    function calculate() {
        const oldVal = parseFloat(document.getElementById('oldMeter').value) || 0;
        const newVal = parseFloat(document.getElementById('newMeter').value) || 0;

        if (newVal < oldVal) {
            alert('លេខម៉ែត្រថ្មីត្រូវតែធំជាង ឬស្មើនឹងលេខម៉ែត្រចាស់!');
            return;
        }

        const units = newVal - oldVal;
        let rate = 0;
        let activeId = 'tier1';

        for (const tier of tiers) {
            if (units <= tier.max) {
                rate = tier.rate;
                activeId = tier.id;
                break;
            }
        }

        const total = units * rate;
        const maxUnits = 200;
        const progress = Math.min((units / maxUnits) * 100, 100);

        // Update displays
        document.getElementById('unitsDisplay').textContent = units.toLocaleString();
        document.getElementById('rateDisplay').textContent = rate.toLocaleString();
        document.getElementById('rangeDisplay').textContent = ${oldVal} → ${newVal};
        document.getElementById('totalDisplay').textContent = total.toLocaleString();
        document.getElementById('progressFill').style.width = ${progress}%;

        // Highlight active tier
        tiers.forEach(t => {
            const el = document.getElementById(t.id);
            el.classList.remove('active');
        });
        document.getElementById(activeId).classList.add('active');

        // Highlight stat circles
        document.querySelectorAll('.stat-circle').forEach(el => el.classList.remove('highlight'));
        setTimeout(() => {
            document.querySelectorAll('.stat-circle').forEach(el => el.classList.add('highlight'));
        }, 100);
    }

    function resetAll() {
        document.getElementById('oldMeter').value = '0';
        document.getElementById('newMeter').value = '0';
        document.getElementById('unitsDisplay').textContent = '—';
        document.getElementById('rateDisplay').textContent = '—';
        document.getElementById('rangeDisplay').textContent = '—';
        document.getElementById('totalDisplay').textContent = '០';
        document.getElementById('progressFill').style.width = '0%';

        tiers.forEach(t => {
            document.getElementById(t.id).classList.remove('active');
        });
        document.querySelectorAll('.stat-circle').forEach(el => el.classList.remove('highlight'));
    }

    // Enter key support
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') calculate();
        });
    });
</script>

</body>
</html>
