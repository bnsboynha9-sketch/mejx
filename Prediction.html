function predictFortune(event) {
    event.preventDefault();

    const phoneInput = document.getElementById("phone_number").value.trim();
    const successBox = document.getElementById("success-box");
    const errorBox = document.getElementById("error-box");
    const resultDisplay = document.getElementById("result-display");
    const resultNumDiv = document.getElementById("result-number");
    const resultTextSpan = document.getElementById("result-text-content");

    // លាក់ប្រអប់លទ្ធផលទាំងអស់សិន
    successBox.style.display = "none";
    errorBox.style.display = "none";
    resultDisplay.style.display = "none";

    // ១. ពិនិត្យមើលថាតើប្រអប់ទទេរឬអត់
    if (phoneInput === "") {
        errorBox.textContent = "សូមបញ្ចូលលេខទូរស័ព្ទរបស់អ្នក!";
        errorBox.style.display = "block";
        return;
    }

    // ២. ពិនិត្យមើលថាតើត្រូវចំជាលេខសុទ្ធ និងមានប្រវែង ៩ ឬ ១០ ខ្ទង់ឬអត់
    const numRegex = /^[0-9]{9,10}$/;
    if (!numRegex.test(phoneInput)) {
        errorBox.textContent = "សូមបញ្ចូលលេខទូរស័ព្ទឱ្យបានត្រឹមត្រូវ !";
        errorBox.style.display = "block";
        return;
    }

    // ៣. ចាប់យក ៦ ខ្ទង់ចុងក្រោយជានិច្ច ទោះបីជាលេខមាន ៩ ឬ ១០ ខ្ទង់ក៏ដោយ
    let last6Digits = phoneInput.slice(-6);

    const division = parseInt(last6Digits, 10) / 80;
    const decimalPart = division - Math.floor(division);
    let resultNum = Math.round(decimalPart * 80);

    if (resultNum === 0) {
        resultNum = 80;
    }

    if (rules[resultNum]) {
        successBox.textContent = "គណនាលេខវាសនាបានជោគជ័យ!";
        successBox.style.display = "block";

        resultNumDiv.textContent = "លទ្ធផលលេខកូដ៖ លេខ " + resultNum;
        resultTextSpan.textContent = rules[resultNum];
        resultDisplay.style.display = "block";
    }
}
