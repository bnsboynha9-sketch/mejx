function predictPhone() {
    const phoneInput = document.getElementById('phone').value.trim();
    
    // Extract only numbers from the input string
    const numbersOnly = phoneInput.replace(/\D/g, '');
    
    if (numbersOnly.length < 6) {
        alert("សូមបញ្ចូលលេខទូរស័ព្ទឲ្យបានយ៉ាងតិច ៦ ខ្ទង់!");
        return;
    }
    
    // Get the last 6 digits
    const lastSixDigits = parseInt(numbersOnly.slice(-6));
    
    // Math formula: (Last 6 digits / 80) -> Take decimal part -> Multiply by 80
    const dividedValue = lastSixDigits / 80;
    const decimalPart = dividedValue - Math.floor(dividedValue);
    let finalKey = Math.round(decimalPart * 80);
    
    // If the remainder is exactly 0, it maps to 80
    if (finalKey === 0) {
        finalKey = 80;
    }
    
    const resultData = results[finalKey];
    
    if (resultData) {
        document.getElementById('finalNumber').innerText = finalKey;
        
        const statusEl = document.getElementById('status');
        statusEl.innerText = resultData.type;
        
        // Remove old classes
        statusEl.className = 'type';
        
        // Assign color categories dynamically based on text keywords
        if (resultData.type.includes("ល្អណាស់") || resultData.type === "ល្អ") {
            statusEl.classList.add('type-good');
        } else if (resultData.type === "ធម្មតា") {
            statusEl.classList.add('type-normal');
        } else {
            statusEl.classList.add('type-bad');
        }
        
        document.getElementById('description').innerText = resultData.desc;
        document.getElementById('resultBox').style.display = 'block';
    }
}
</script>
