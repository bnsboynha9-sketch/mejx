<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Run</title>
<style>
body{
    margin:0;
    background:#f7f7f7;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
}
canvas{
    border:2px solid #333;
    background:white;
}
</style>
</head>
<body>

<canvas id="game" width="900" height="300"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Dino
const dino={
    x:60,
    y:220,
    w:40,
    h:40,
    vy:0,
    jumping:false
};

const gravity=0.8;
const ground=220;

// Obstacles
let obstacles=[];
let speed=6;
let score=0;
let gameOver=false;

function addObstacle(){
    obstacles.push({
        x:canvas.width,
        y:220,
        w:20+Math.random()*20,
        h:30+Math.random()*30
    });
}

setInterval(()=>{
    if(!gameOver) addObstacle();
},1500);

// Jump
function jump(){
    if(!dino.jumping){
        dino.vy=-15;
        dino.jumping=true;
    }
}

document.addEventListener("keydown",e=>{
    if(e.code==="Space"||e.code==="ArrowUp"){
        jump();
    }
});

document.addEventListener("touchstart",jump);

// Draw Dino
function drawDino(){
    ctx.fillStyle="#222";
    ctx.fillRect(dino.x,dino.y,dino.w,dino.h);
}

// Draw Ground
function drawGround(){
    ctx.strokeStyle="#555";
    ctx.beginPath();
    ctx.moveTo(0,260);
    ctx.lineTo(canvas.width,260);
    ctx.stroke();
}

// Draw Obstacles
function drawObstacles(){
    ctx.fillStyle="green";
    obstacles.forEach(o=>{
        ctx.fillRect(o.x,o.y+40-o.h,o.w,o.h);
    });
}

// Collision
function collide(a,b){
    return(
        a.x<b.x+b.w &&
        a.x+a.w>b.x &&
        a.y<b.y+40 &&
        a.y+a.h>b.y+40-b.h
    );
}

function update(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawGround();

    // Dino physics
    dino.vy+=gravity;
    dino.y+=dino.vy;

    if(dino.y>=ground){
        dino.y=ground;
        dino.vy=0;
        dino.jumping=false;
    }

    drawDino();

    obstacles.forEach((o,i)=>{
        o.x-=speed;

        if(collide(dino,o)){
            gameOver=true;
        }

        if(o.x+o.w<0){
            obstacles.splice(i,1);
            score++;
            if(score%5===0) speed+=0.5;
        }
    });

    drawObstacles();

    ctx.fillStyle="#000";
    ctx.font="24px Arial";
    ctx.fillText("Score: "+score,20,30);

    if(gameOver){
        ctx.font="40px Arial";
        ctx.fillStyle="red";
        ctx.fillText("GAME OVER",320,130);

        ctx.font="24px Arial";
        ctx.fillStyle="black";
        ctx.fillText("Press R to Restart",320,180);
    }else{
        requestAnimationFrame(update);
    }
}

document.addEventListener("keydown",e=>{
    if(e.key==="r" && gameOver){
        location.reload();
    }
});

update();
</script>

</body>
</html>
